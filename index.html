<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Galaxy Z Fold · My Phone</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e9ec;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px}.toolbar{display:flex;gap:10px;align-items:center;color:#292930;font-size:13px;flex-wrap:wrap;justify-content:center}.toolbar button{border:1px solid #ccc;background:#fff;border-radius:24px;padding:11px 17px;cursor:pointer;font-size:14px}.device{width:min(350px,92vw);aspect-ratio:0.47;background:#0b0b0e;border:7px solid #24242b;border-radius:36px;box-shadow:0 20px 60px #0003;position:relative;overflow:hidden;transition:width .45s,aspect-ratio .45s,border-radius .45s}.device.open{width:min(700px,96vw);aspect-ratio:1.12;border-radius:24px}.device:before{content:'';position:absolute;z-index:9;top:9px;left:50%;transform:translateX(-50%);width:7px;height:7px;background:#18191d;border:1px solid #38393e;border-radius:50%}.device.open:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff10;pointer-events:none;z-index:8}.screen{position:absolute;inset:0;background:#000;overflow:hidden}.status{height:40px;padding:12px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:650;position:relative;z-index:5}.view{height:calc(100% - 40px);position:relative}.lock{height:100%;background:#000;display:flex;align-items:center;flex-direction:column;cursor:pointer}.lock .date{margin-top:17%;font-size:15px;color:#ddd}.lock .time{font-size:clamp(56px,11vw,90px);font-weight:250;letter-spacing:-4px;margin-top:3px}.lock .hint{margin-top:auto;margin-bottom:62px;font-size:13px;color:#a5a5aa}.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:100px;height:4px;background:#e6e6eb;border-radius:5px;z-index:10;cursor:pointer}.pin{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#080808}.pin .title{font-size:20px}.dots{display:flex;gap:17px}.dot{width:12px;height:12px;border:1px solid #fff;border-radius:50%}.dot.filled{background:#fff}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 20px}.pad button{width:72px;height:72px;border-radius:50%;background:#ffffff25;border:0;color:#fff;font-size:30px;cursor:pointer}.pad button:active{background:#ffffff60}.pin-foot{display:flex;gap:80px;font-size:13px}.pin-foot button{background:none;color:#ddd;border:0;cursor:pointer}.error{height:17px;color:#ff8c8c;font-size:12px}.desktop{height:100%;background:linear-gradient(145deg,#111421 0%,#252d4a 38%,#51426e 72%,#1b2038 100%);padding:12px 15px 30px;display:flex;flex-direction:column}.widget{border-radius:22px;background:#ffffff1a;backdrop-filter:blur(10px);padding:16px;margin:16px 2px 26px;display:flex;align-items:center;justify-content:space-between}.widget .clock{font-size:35px;font-weight:300}.widget .sub{font-size:12px;color:#ddd}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 7px}.open .apps{grid-template-columns:repeat(5,minmax(0,1fr));gap:24px 12px}.app{border:0;background:none;color:white;display:flex;align-items:center;flex-direction:column;gap:6px;cursor:pointer;min-width:0}.icon{height:clamp(47px,12vw,61px);width:clamp(47px,12vw,61px);border-radius:19px;display:grid;place-items:center;font-weight:700;font-size:23px;box-shadow:0 3px 10px #0002;overflow:hidden}.app small{font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%;text-shadow:0 1px 3px #0007}.dock{margin-top:auto;display:flex;justify-content:space-around;background:#ffffff25;border-radius:24px;padding:13px 4px}.dock .app small{display:none}.dock .icon{width:52px;height:52px}.page{height:100%;background:#f7f7f9;color:#18181d;display:flex;flex-direction:column}.pagehead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #e6e6e8}.pagehead button{border:0;background:none;font-size:24px;cursor:pointer}.pagehead strong{font-size:19px}.pagebody{padding:18px;overflow:auto;flex:1}.card{padding:16px;border-radius:16px;background:#fff;margin-bottom:12px;border:1px solid #ededf0;color:#25252a}.muted{color:#777;font-size:13px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photos div{aspect-ratio:1;background:linear-gradient(135deg,#d9dce8,#a6a6bb);display:grid;place-items:center;font-size:11px;color:#555}.memo{width:100%;min-height:210px;border:0;outline:none;font:16px/1.6 inherit;resize:vertical;background:#fff;padding:15px;border-radius:12px}.msg{border-radius:18px;background:#e7e8ee;padding:12px 15px;margin:8px 0;max-width:85%;width:fit-content}.msg.mine{margin-left:auto;background:#f9df56}.camera{background:#0c0c0c;color:#fff;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.shutter{border:5px solid #fff;background:#fff;border-radius:50%;width:64px;height:64px;box-shadow:inset 0 0 0 4px #111;cursor:pointer}.toast{font-size:12px;color:#aaa}.linkbutton{display:inline-block;background:#252636;color:#fff;padding:12px 16px;border-radius:12px;text-decoration:none;margin-top:12px}.note{font-size:12px;color:#666;max-width:700px;text-align:center;line-height:1.5}@media(max-height:750px){.device{width:min(295px,85vw)}.device.open{width:min(620px,96vw)}.apps{gap:12px 6px}.widget{margin:8px 2px 16px}.stage{padding:12px}}
</style></head><body><div class="stage"><div class="toolbar"><button id="foldBtn">↔ 펼치기</button><button id="resetBtn">🔒 잠금화면</button><span id="mode">커버 화면</span></div><div class="device" id="device"><div class="screen"><div class="status"><span>2:10</span><span>▴ ▰ ◕ 85%</span></div><div class="view" id="view"></div><div class="homebar" id="homebar" title="홈으로"></div></div></div><div class="note">갤럭시 Z 폴드 스타일 웹 시뮬레이션 · 비밀번호 0210 · 앱의 실제 계정이나 카메라에는 연결되지 않아.</div></div><script>
const device=document.getElementById('device'),view=document.getElementById('view'),foldBtn=document.getElementById('foldBtn');let state='lock',digits='',opened=false,active='';
const apps=[['Bubble','B','linear-gradient(135deg,#79d8f5,#3175db)'],['Weverse','W','linear-gradient(135deg,#26dbbd,#14a9a1)'],['YouTube','▶','#ff2424'],['카카오톡','TALK','#ffdf00'],['Gemini','✦','linear-gradient(135deg,#6e91f4,#bc73d9)'],['Instagram','◎','linear-gradient(45deg,#ffbe43,#ee3d74,#803ae7)'],['카메라','📷','#3d414a'],['갤러리','✿','linear-gradient(135deg,#ffae47,#ed508e,#6a65e9)'],['메모','▤','#ffbd43'],['메시지','●','#428df6']];
function draw(){if(state==='lock'){view.innerHTML='<div class="lock" id="unlock"><div class="date">10월 21일 수요일</div><div class="time">오전 2:10</div><div class="hint">화면을 터치하거나 위로 밀어 잠금 해제</div></div>';const el=document.getElementById('unlock');el.onclick=()=>{state='pin';draw()};let y=0;el.addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});el.addEventListener('touchend',e=>{if(y-e.changedTouches[0].clientY>35){state='pin';draw()}},{passive:true});return}
if(state==='pin'){view.innerHTML='<div class="pin"><div class="title">PIN 입력</div><div class="dots">'+[0,1,2,3].map(i=>'<span class="dot '+(i<digits.length?'filled':'')+'"></span>').join('')+'</div><div class="error" id="error"></div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':'<button data-n="'+n+'">'+n+'</button>').join('')+'</div><div class="pin-foot"><button id="cancel">취소</button><button id="erase">지우기</button></div></div>';view.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{digits+=b.dataset.n;if(digits.length===4){if(digits==='0210'){digits='';state='home';draw()}else{digits='';draw();document.getElementById('error').textContent='비밀번호가 일치하지 않아.'}}else draw()});document.getElementById('cancel').onclick=()=>{digits='';state='lock';draw()};document.getElementById('erase').onclick=()=>{digits=digits.slice(0,-1);draw()};return}
if(state==='home'){let icon=([name,symbol,bg])=>'<button class="app" data-app="'+name+'"><span class="icon" style="background:'+bg+';color:'+(name==='카카오톡'?'#371e1e':'white')+'">'+symbol+'</span><small>'+name+'</small></button>';view.innerHTML='<div class="desktop"><div class="widget"><div><div class="clock">02:10</div><div class="sub">10월 21일 수요일</div></div><div style="font-size:24px">☾</div></div><div class="apps">'+apps.map(icon).join('')+'</div><div class="dock">'+[apps[3],apps[9],apps[6],apps[7]].map(icon).join('')+'</div></div>';view.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{active=b.dataset.app;state='app';draw()});return}
if(state==='app'){let content='';if(active==='갤러리')content='<div class="muted" style="margin-bottom:14px">사진을 추가하면 이곳에 표시돼.</div><div class="photos">'+Array.from({length:9},(_,i)=>'<div>사진 '+(i+1)+'</div>').join('')+'</div>';else if(active==='메모')content='<div class="muted" style="margin-bottom:12px">임시 메모 · 새로고침하면 초기화돼</div><textarea class="memo" placeholder="여기에 원하는 메모를 입력해..."></textarea>';else if(active==='메시지'||active==='카카오톡'||active==='Bubble'||active==='Weverse')content='<div class="card"><strong>대화 화면</strong><p class="muted">원하는 인물과 대화 내용을 추후 추가할 수 있어.</p></div><div class="msg">안녕! 👋</div><div class="msg mine">반가워!</div>';else if(active==='카메라')content='<div class="camera"><div>📷 카메라 미리보기</div><div class="toast">웹 데모에서는 실제 촬영하지 않아</div><button class="shutter" id="shutter" aria-label="셔터"></button><div class="toast" id="cameraToast"></div></div>';else if(active==='YouTube')content='<div class="card">▶️ <strong>동영상 목록</strong><p class="muted">원하는 영상 링크나 썸네일을 추가할 수 있어.</p></div>';else if(active==='Instagram')content='<div class="card"><strong>프로필 · 게시물</strong><p class="muted">원하는 프로필과 피드를 구성할 수 있어.</p></div>';else if(active==='Gemini')content='<div class="card">✦ <strong>Gemini 스타일 화면</strong><p class="muted">원하는 채팅 내용을 배치할 수 있어. 실제 AI 서비스와는 연결되지 않아.</p></div>';view.innerHTML='<div class="page"><div class="pagehead"><button id="back" aria-label="뒤로">‹</button><strong>'+active+'</strong></div><div class="pagebody" style="'+(active==='카메라'?'padding:0;display:flex;':'')+'">'+content+'</div></div>';document.getElementById('back').onclick=()=>{state='home';draw()};if(active==='카메라')document.getElementById('shutter').onclick=()=>document.getElementById('cameraToast').textContent='촬영 기능은 콘텐츠 추가 단계에서 결정할 수 있어.'}}
foldBtn.onclick=()=>{opened=!opened;device.classList.toggle('open',opened);foldBtn.textContent=opened?'↔ 접기':'↔ 펼치기';document.getElementById('mode').textContent=opened?'내부 화면':'커버 화면';draw()};document.getElementById('resetBtn').onclick=()=>{state='lock';digits='';draw()};document.getElementById('homebar').onclick=()=>{if(state==='app'){state='home';draw()}else if(state==='home'){state='lock';draw()}else if(state==='lock'){state='pin';draw()}};draw();
</script></body></html>
