 inner='<div class="kakao-top"><h2>채팅</h2><div class="kakao-tools"><span>⌕</span><span>＋</span><span>⚙</span></div></div><div class="kakao-list">'+rooms.map(([id,name,preview,date,kind,symbol])=>'<button class="kakao-chat-row" data-room="'+id+'"><span class="kakao-avatar '+kind+'">'+symbol+'</span><span class="chat-info"><span class="chat-name">'+(id==='playve'?'📌 ':'')+name+'</span><div class="chat-preview">'+preview+'</div></span><span class="chat-meta">'+date+'</span></button>').join('')+'</div>';
}
const nav='<nav class="kakao-nav" aria-label="카카오톡 하단 메뉴">'+tabs.map(([label,icon])=>'<button class="kakao-tab '+(label===kakaoTab?'selected':'')+'" data-tab="'+label+'" '+(!['친구','채팅'].includes(label)?'disabled aria-label="'+label+' (준비 중)"':'')+'><span class="tabicon">'+icon+'</span><span>'+label+'</span></button>').join('')+'</nav>';
view.innerHTML='<div class="kakao">'+inner+((kakaoPerson||kakaoRoom)?'':nav)+'</div>';
view.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{kakaoTab=b.dataset.tab;kakaoPerson='';kakaoRoom='';draw()});
view.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{kakaoPerson=b.dataset.person;draw()});
view.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{kakaoRoom=b.dataset.room;draw()});const roomBack=view.querySelector('#kakaoRoomBack');if(roomBack)roomBack.onclick=()=>{kakaoRoom='';draw()};const back=view.querySelector('#kakaoBack');if(back)back.onclick=()=>{kakaoPerson='';draw()};return;
}
if(state==='app'){let content='';if(active==='갤러리')content='<div class="muted" style="margin-bottom:14px">사진을 추가하면 이곳에 표시돼.</div><div class="photos">'+Array.from({length:9},(_,i)=>'<div>사진 '+(i+1)+'</div>').join('')+'</div>';else if(active==='메모')content='<div class="muted" style="margin-bottom:12px">임시 메모 · 새로고침하면 초기화돼</div><textarea class="memo" placeholder="여기에 원하는 메모를 입력해..."></textarea>';else if(active==='메시지'||active==='카카오톡'||active==='Bubble'||active==='Weverse')content='<div class="card"><strong>대화 화면</strong><p class="muted">원하는 인물과 대화 내용을 추후 추가할 수 있어.</p></div><div class="msg">안녕! 👋</div><div class="msg mine">반가워!</div>';else if(active==='카메라')content='<div class="camera"><div>📷 카메라 미리보기</div><div class="toast">웹 데모에서는 실제 촬영하지 않아</div><button class="shutter" id="shutter" aria-label="셔터"></button><div class="toast" id="cameraToast"></div></div>';else if(active==='YouTube')content='<div class="card">▶️ <strong>동영상 목록</strong><p class="muted">원하는 영상 링크나 썸네일을 추가할 수 있어.</p></div>';else if(active==='Instagram')content='<div class="card"><strong>프로필 · 게시물</strong><p class="muted">원하는 프로필과 피드를 구성할 수 있어.</p></div>';else if(active==='Gemini')content='<div class="card">✦ <strong>Gemini 스타일 화면</strong><p class="muted">원하는 채팅 내용을 배치할 수 있어. 실제 AI 서비스와는 연결되지 않아.</p></div>';view.innerHTML='<div class="page"><div class="pagehead"><button id="back" aria-label="뒤로">‹</button><strong>'+active+'</strong></div><div class="pagebody" style="'+(active==='카메라'?'padding:0;display:flex;':'')+'">'+content+'</div></div>';document.getElementById('back').onclick=()=>{state='home';draw()};if(active==='카메라')document.getElementById('shutter').onclick=()=>document.getElementById('cameraToast').textContent='촬영 기능은 콘텐츠 추가 단계에서 결정할 수 있어.'}}
foldBtn.onclick=()=>{opened=!opened;device.classList.toggle('open',opened);foldBtn.textContent=opened?'↔ 접기':'↔ 펼치기';document.getElementById('mode').textContent=opened?'내부 화면':'커버 화면';draw()};document.getElementById('resetBtn').onclick=()=>{state='lock';digits='';draw()};document.getElementById('homebar').onclick=()=>{if(state==='app'){state='home';draw()}else if(state==='home'){state='lock';draw()}else if(state==='lock'){state='pin';draw()}};draw();
</script></body></html>
