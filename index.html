function composeHangul(raw){
 const ini='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',vow='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',fin=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
 const chars=[...raw];let out='';
 for(let i=0;i<chars.length;){let a=ini.indexOf(chars[i]);if(a<0||i+1>=chars.length||vow.indexOf(chars[i+1])<0){out+=chars[i++];continue}
 let b=vow.indexOf(chars[i+1]);let f=0,used=2;
 if(i+2<chars.length){const c=fin.indexOf(chars[i+2]);if(c>0&&(i+3>=chars.length||vow.indexOf(chars[i+3])<0)){f=c;used=3}}
 out+=String.fromCharCode(0xAC00+(a*21+b)*28+f);i+=used;
 }
 return out;
}

function showSimKeyboard(kb){if(!kb)return;clearTimeout(kb._hideTimer);kb.hidden=false;kb.classList.remove('kb-closing','kb-opening');void kb.offsetWidth;kb.classList.add('kb-opening')}
function hideSimKeyboard(kb){if(!kb||kb.hidden)return;clearTimeout(kb._hideTimer);kb.classList.remove('kb-opening','kb-closing');void kb.offsetWidth;kb.classList.add('kb-closing');kb._hideTimer=setTimeout(()=>{kb.hidden=true;kb.classList.remove('kb-closing')},220)}
function setupSimKeyboard(input,showNow=false){
 const kb=document.getElementById('simKeyboard');if(!kb)return;let keyboardRaw=input.value;
 const left=[['1','2','3','4','5','6','7','8','9','0'],['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫'],['!#1','한/영','☻','space','.', '↵']];
 const folded=left.map(row=>'<div class="kb-row">'+row.map(k=>'<button type="button" class="kb-key '+(['⇧','⌫','!#1','한/영','↵'].includes(k)?'special ':'')+(k==='space'?'space ':(['⇧','⌫'].includes(k)?'wide':''))+'" data-key="'+k+'">'+(k==='space'?'ㅤ':k)+'</button>').join('')+'</div>').join('');
 kb.innerHTML='<div class="kb-toolbar"><button class="kb-hide" type="button" aria-label="키보드 닫기">▾</button><span>▤ &nbsp; 붙여넣기</span><span>⚙</span></div><div class="kb-keys">'+(opened?'<div>'+left.map(row=>'<div class="kb-row">'+row.slice(0,Math.ceil(row.length/2)).map(k=>'<button type="button" class="kb-key '+(k==='space'?'space':'')+'" data-key="'+k+'">'+(k==='space'?'ㅤ':k)+'</button>').join('')+'</div>').join('')+'</div><div>'+left.map(row=>'<div class="kb-row">'+row.slice(Math.ceil(row.length/2)).map(k=>'<button type="button" class="kb-key '+(k==='space'?'space':'')+'" data-key="'+k+'">'+(k==='space'?'ㅤ':k)+'</button>').join('')+'</div>').join('')+'</div>':folded)+'</div>';
 kb.querySelector('.kb-hide').onclick=()=>{hideSimKeyboard(kb);input.blur()};
 kb.querySelectorAll('[data-key]').forEach(btn=>btn.onclick=()=>{
 const key=btn.dataset.key;if(key==='↵'){document.getElementById('sendReply')?.click();return}
 if(key==='⌫'){keyboardRaw=keyboardRaw.slice(0,-1);input.value=composeHangul(keyboardRaw);return}
 if(key==='한/영'||key==='⇧'||key==='!#1')return;
 if(key==='☻'){keyboardRaw+='😊';input.value=composeHangul(keyboardRaw);return}
 keyboardRaw+=key==='space'?' ':key;input.value=composeHangul(keyboardRaw);
 });
 input.addEventListener('input',()=>{keyboardRaw=input.value});
 const desktopKeyboard=window.matchMedia('(hover: hover) and (pointer: fine)').matches;
 input.addEventListener('focus',()=>{if(!desktopKeyboard)showSimKeyboard(kb)});
 if(!desktopKeyboard){input.addEventListener('pointerdown',e=>{e.preventDefault();showSimKeyboard(kb)});input.addEventListener('click',()=>{showSimKeyboard(kb);input.blur()})}
 else {input.addEventListener('focus',()=>hideSimKeyboard(kb));input.addEventListener('input',()=>{keyboardRaw=input.value})}
 if(showNow)showSimKeyboard(kb);
}
